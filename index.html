            if (hasMedal) {

                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#9E3039', '#ffffff', '#C0C0C0'] // Latvijas karogs + Sudrabs
                });
            }
          }, [hasMedal]);

          useEffect(() => {
            const timer = setInterval(() => {
              setCurrentTime(prev => new Date(prev.getTime() + 60000));
            }, 60000);
            return () => clearInterval(timer);
          }, []);

          const processedSchedule = useMemo(() => {
            const sorted = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
            const grouped = sorted.reduce((acc, item) => {
              if (!acc[item.date]) acc[item.date] = [];
              acc[item.date].push(item);
              return acc;
            }, {});
            return grouped;
          }, [events]);

             // Rādīt rezultātus, kas ir pabeigti VAI medaļu gadījumā
             return events.filter(e => e.result && (e.status === 'Pabeigts' || e.isMedal)).reverse();

            const date = new Date(dateStr);
            const today = new Date("2026-02-10");
            const tomorrow = new Date("2026-02-11");
            
            if (date.toDateString() === today.toDateString()) return "Šodien, 10. februāris";
            if (date.toDateString() === tomorrow.toDateString()) return "Rīt, 11. februāris";
            return new Intl.DateTimeFormat('lv-LV', { weekday: 'long', day: 'numeric', month: 'long' }).format(date);
          };

          const isPast = (dateStr) => new Date(dateStr) < new Date("2026-02-10");

                        <p className="text-xs text-white/80 font-medium">Latvijas Izlases Kalendārs</p>

                    <div className="text-right hidden sm:block">

                              ? 'bg-slate-100 text-[#9E3039]' 
                              : 'text-white/70 hover:bg-white/10'
                          }`}

                          {tab === 'schedule' ? 'Kalendārs' : 
                           tab === 'results' ? 'Panākumi' : 
                           tab === 'roster' ? 'Sastāvs' : 'Noderīgi'}

                               <span className="absolute top-1 right-1 w-2 h-2 bg-slate-300 rounded-full animate-ping"></span>
                           )}
                        </button>
                    ))}
                  </div>

                                      </h3>
                                      <div className="text-xs text-slate-500 mt-1 truncate flex items-center">
                                        <Users className="w-3 h-3 mr-1" />
                                        {event.athletes}
                                      </div>
                                    </div>
                                  </div>

                                  <div className="flex items-center space-x-3 shrink-0 pl-2 text-right">
                                     <div>
                                       {event.result ? (
                                           <div className={`text-sm font-bold ${event.isMedal ? 'text-slate-600 text-base' : 'text-slate-800'}`}>{event.result}</div>
                                       ) : (
                                           <div className="text-lg font-bold font-mono text-slate-800">{event.time}</div>
                                       )}
                                       <div className="text-[10px] uppercase font-bold text-slate-400">
                                           {event.status === 'Pabeigts' ? 'Beidzies' : 'TV: ' + event.channel}
                                       </div>
                                     </div>
                                     <ChevronRight className="w-5 h-5 text-slate-300 group-hover:text-[#9E3039]" />
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                    )})}
                  </div>
                )}

                {/* --- PANĀKUMI (REZULTĀTI) --- */}
                {activeTab === 'results' && (
                  <div className="animate-fade-in space-y-4">
                     <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                        <Trophy className="w-12 h-12 text-[#9E3039] mx-auto mb-2" />
                        <h2 className="text-xl font-bold text-slate-800">Latvijas Rezultāti</h2>
                        <div className="text-3xl font-bold text-slate-900 mt-4 flex justify-center gap-4">
                            <div className="text-center">
                                <span className="block text-yellow-500">0</span>
                                <span className="text-xs text-slate-400 font-normal uppercase">Zelts</span>
                            </div>
                            <div className="text-center">
                                <span className="block text-slate-500">1</span>
                                <span className="text-xs text-slate-400 font-normal uppercase">Sudrabs</span>
                            </div>
                            <div className="text-center">
                                <span className="block text-amber-700">0</span>
                                <span className="text-xs text-slate-400 font-normal uppercase">Bronza</span>
                            </div>
                        </div>
                     </div>

                     <div className="space-y-3">
                        {results.map((event) => (
                           <div key={event.id} onClick={() => setSelectedEvent(event)} className={`bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center cursor-pointer ${
                               event.isMedal ? 'border-slate-300 bg-slate-50' : 'border-slate-200'
                           }`}>
                              <div>
                                 <div className="text-xs font-bold text-slate-400 uppercase">{event.sport} • {formatDateLatvian(event.date)}</div>
                                 <h3 className="font-bold text-slate-900 flex items-center">
                                     {event.event}
                                     {event.isMedal && <Medal className="w-4 h-4 ml-2 text-slate-500" />}
                                 </h3>
                                 <div className="text-sm text-slate-600 mt-1">{event.athletes}</div>
                              </div>
                              <div className="text-right">
                                 <div className={`text-xl font-bold ${event.isMedal ? 'text-slate-500' : 'text-[#9E3039]'}`}>{event.result}</div>
                              </div>
                           </div>
                        ))}
                     </div>
                  </div>
                )}

                 {/* --- INFO / SASTĀVS --- */}
                {(activeTab === 'info' || activeTab === 'roster') && (
                  <div className="animate-fade-in text-center py-10 text-slate-400">
                      <Info className="w-10 h-10 mx-auto mb-2 opacity-50" />
                      <p>Informācija pieejama citās sadaļās.</p>
                      <button onClick={() => setActiveTab('schedule')} className="text-[#9E3039] font-bold mt-2">Atgriezties uz Kalendāru</button>
                  </div>
                )}

              </main>

              {/* Detalizētā skata logs */}
              {selectedEvent && (
                <SacensibuCentrs event={selectedEvent} onClose={() => setSelectedEvent(null)} />
              )}

            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<LatviaOlympicsApp />);
    </script>
</body>
</html>
