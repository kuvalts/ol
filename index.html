            const uniqueSports = [...new Set(LATVIJAS_GRAFIKS.map(item => item.sport))];
            return ['Visi', ...uniqueSports];
          }, []);

          // Filtrēšana un Grupēšana
          const processedSchedule = useMemo(() => {
            let filtered = events;
            if (filterSport !== 'Visi') {
              filtered = filtered.filter(e => e.sport === filterSport);
            }
            
            // Kārtot pēc datuma un laika
            filtered.sort((a, b) => new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time));

            const grouped = filtered.reduce((acc, item) => {
              if (!acc[item.date]) acc[item.date] = [];
              acc[item.date].push(item);
              return acc;
            }, {});

            return grouped;
          }, [filterSport, events]);

          const formatDateLatvian = (dateStr) => {
            const date = new Date(dateStr);
            const today = new Date("2026-02-09");
            const tomorrow = new Date("2026-02-10");
            
            if (date.toDateString() === today.toDateString()) return "Šodien, 9. februāris";
            if (date.toDateString() === tomorrow.toDateString()) return "Rīt, 10. februāris";
            
            // Latvian formatting using Intl
            return new Intl.DateTimeFormat('lv-LV', { weekday: 'long', day: 'numeric', month: 'long' }).format(date);
          };

          return (
            <div className="min-h-screen bg-slate-100 font-sans text-slate-900 pb-10">
              
              {/* Galvene */}
              <header className="bg-gradient-to-r from-[#9E3039] to-[#7a242b] text-white shadow-lg sticky top-0 z-40">
                <div className="max-w-3xl mx-auto px-4 py-4">
                  <div className="flex justify-between items-center">
                    <div className="flex items-center space-x-3">
                      <div className="bg-white text-[#9E3039] font-bold h-10 w-10 flex items-center justify-center rounded-full shadow-md text-xl">
                        LV
                      </div>
                      <div>
                        <h1 className="text-lg font-bold leading-tight">Milano Cortina 2026</h1>
                        <p className="text-xs text-white/80 font-medium">Latvijas Izlases Kalendārs</p>
                      </div>
                    </div>
                    <div className="text-right hidden sm:block">
                       <div className="text-xs font-medium uppercase opacity-80">Rīgas Laiks</div>
                       <div className="font-mono font-bold text-lg">
                         {currentTime.toLocaleTimeString('lv-LV', { hour: '2-digit', minute: '2-digit' })}
                       </div>
                    </div>
                  </div>

                  {/* Navigācija */}
                  <div className="flex mt-4 space-x-1 overflow-x-auto scrollbar-hide">
                    <button
                      onClick={() => setActiveTab('schedule')}
                      className={`px-4 py-2 rounded-t-lg text-sm font-bold transition-all ${
                        activeTab === 'schedule' 
                          ? 'bg-slate-100 text-[#9E3039]' 
                          : 'text-white/70 hover:bg-white/10'
                      }`}
                    >
                      Kalendārs
                    </button>
                    <button
                      onClick={() => setActiveTab('roster')}
                      className={`px-4 py-2 rounded-t-lg text-sm font-bold transition-all ${
                        activeTab === 'roster' 
                          ? 'bg-slate-100 text-[#9E3039]' 
                          : 'text-white/70 hover:bg-white/10'
                      }`}
                    >
                      Izlases Sastāvs
                    </button>
                     <button
                      onClick={() => setActiveTab('info')}
                      className={`px-4 py-2 rounded-t-lg text-sm font-bold transition-all ${
                        activeTab === 'info' 
                          ? 'bg-slate-100 text-[#9E3039]' 
                          : 'text-white/70 hover:bg-white/10'
                      }`}
                    >
                      Noderīgi
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-3xl mx-auto px-4 py-6">
                
                {activeTab === 'schedule' && (
                  <div className="animate-fade-in">
                    {/* Filtri */}
                    <div className="mb-6 flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                      {sportsList.map(sport => (
                        <button
                          key={sport}
                          onClick={() => setFilterSport(sport)}
                          className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border ${
                            filterSport === sport 
                              ? 'bg-[#9E3039] text-white border-[#9E3039] shadow-md' 
                              : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'
                          }`}
                        >
                          {sport}
                        </button>
                      ))}
                    </div>

                    {/* Saraksts */}
                    <div className="space-y-8">
                      {Object.keys(processedSchedule).map(date => (
                        <div key={date}>
                          {/* Datuma atdalītājs */}
                          <div className="sticky top-[130px] sm:top-[85px] z-30 py-2 bg-slate-100/95 backdrop-blur border-b border-slate-200 mb-4 flex items-center">
                            <div className={`h-2.5 w-2.5 rounded-full mr-3 ${date === '2026-02-09' ? 'bg-blue-600 animate-pulse' : 'bg-[#9E3039]'}`}></div>
                            <h2 className={`text-base font-bold uppercase tracking-wider ${date === '2026-02-09' ? 'text-blue-700' : 'text-slate-600'}`}>
                              {formatDateLatvian(date)}
                            </h2>
                          </div>

                          <div className="space-y-3">
                            {processedSchedule[date].map(event => (
                              <div 
                                key={event.id}
                                onClick={() => setSelectedEvent(event)}
                                className={`group bg-white rounded-xl p-4 shadow-sm border transition-all cursor-pointer relative overflow-hidden hover:shadow-md ${
                                  event.isHighlight ? 'border-l-4 border-l-[#9E3039]' : 'border-slate-200'
                                }`}
                              >
                                <div className="flex justify-between items-center">
                                  <div className="flex items-center space-x-4 overflow-hidden">
                                    {/* Ikona */}
                                    <div className={`h-11 w-11 rounded-full flex items-center justify-center shrink-0 ${
                                      event.isHighlight ? 'bg-red-50 text-[#9E3039]' : 'bg-slate-50 text-slate-400'
                                    }`}>
                                      <SportaIkona sport={event.sport} className="w-5 h-5" />
                                    </div>
                                    
                                    {/* Info */}
                                    <div className="min-w-0 pr-2">
                                      <div className="flex items-center space-x-2 mb-0.5">
                                         <span className="text-[10px] font-bold text-slate-500 uppercase bg-slate-100 px-1.5 py-0.5 rounded">
                                           {event.sport}
                                         </span>
                                         {event.isHighlight && (
                                           <span className="flex items-center text-[10px] font-bold text-amber-600">
                                             <Star className="w-3 h-3 mr-1 fill-current" /> SVARĪGI
                                           </span>
                                         )}
                                      </div>
                                      <h3 className="text-sm sm:text-base font-bold text-slate-900 leading-tight group-hover:text-[#9E3039] transition-colors">
                                        {event.event}
                                      </h3>
                                      <div className="text-xs text-slate-500 mt-1 truncate flex items-center">
                                        <Users className="w-3 h-3 mr-1" />
                                        {event.athletes}
                                      </div>
                                    </div>
                                  </div>

                                  {/* Laiks */}
                                  <div className="flex items-center space-x-3 shrink-0 pl-2">
                                     <div className="text-right">
                                       <div className="text-lg font-bold font-mono text-slate-800">{event.time}</div>
                                       {event.status === 'Pabeigts' ? (
                                          <div className="text-[10px] uppercase font-bold text-slate-400">Beidzies</div>
                                       ) : (
                                          <div className="text-[10px] uppercase font-bold text-slate-400">TV: {event.channel}</div>
                                       )}
                                     </div>
                                     <ChevronRight className="w-5 h-5 text-slate-300 group-hover:text-[#9E3039]" />
                                  </div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                      
                      {Object.keys(processedSchedule).length === 0 && (
                         <div className="text-center py-12 text-slate-400">
                           Nav atrasti notikumi šajā kategorijā.
                         </div>
                      )}
                    </div>
                  </div>
                )}

                {activeTab === 'roster' && (
                  <div className="animate-fade-in space-y-4">
                     <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                       <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center">
                         <Flag className="w-5 h-5 mr-2 text-[#9E3039]" />
                         Latvijas Komandas Līderi
                       </h2>
                       
                       <div className="grid gap-4 sm:grid-cols-2">
                         <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                           <div className="font-bold text-[#9E3039] mb-1">Hokejs</div>
                           <div className="text-sm font-medium">Elvis Merzļikins</div>
                           <div className="text-xs text-slate-500">Vārtsargs (Columbus Blue Jackets)</div>
                           <div className="mt-2 text-sm font-medium">Kaspars Daugaviņš</div>
                           <div className="text-xs text-slate-500">Kapteinis</div>
                         </div>

                         <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                           <div className="font-bold text-[#9E3039] mb-1">Kamaniņas</div>
                           <div className="text-sm font-medium">Kristers Aparjods</div>
                           <div className="text-xs text-slate-500">Vīriešu vieninieki</div>
                           <div className="mt-2 text-sm font-medium">Bots / Plūme</div>
                           <div className="text-xs text-slate-500">Divnieku ekipāža</div>
                         </div>

                         <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                           <div className="font-bold text-[#9E3039] mb-1">Biatlons</div>
                           <div className="text-sm font-medium">Andrejs Rastorgujevs</div>
                           <div className="text-xs text-slate-500">Līderis</div>
                           <div className="mt-2 text-sm font-medium">Baiba Bendika</div>
                           <div className="text-xs text-slate-500">Līdere</div>
                         </div>

                         <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                           <div className="font-bold text-[#9E3039] mb-1">Citi Sporta Veidi</div>
                           <div className="text-sm font-medium">Dženifera Ģērmane</div>
                           <div className="text-xs text-slate-500">Kalnu slēpošana (Slaloms)</div>
                           <div className="mt-2 text-sm font-medium">Deniss Vasiļjevs</div>
                           <div className="text-xs text-slate-500">Daiļslidošana</div>
                         </div>
                       </div>
                     </div>
                  </div>
                )}
                
                {activeTab === 'info' && (
                  <div className="animate-fade-in space-y-4">
                     <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-4 flex items-center">
                         <Info className="w-5 h-5 mr-2 text-[#9E3039]" />
                         Noderīga Informācija
                       </h2>
                       
                       <div className="space-y-4">
                          <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                            <h3 className="font-bold text-slate-900 mb-2 flex items-center">
                               <Tv className="w-4 h-4 mr-2" />
                               Kur skatīties?
                            </h3>
                            <p className="text-sm text-slate-600 mb-2">
                               Visas Latvijas sportistu startus tiešraidē translē <strong>LTV7</strong> un <strong>LSM.lv</strong>. 
                               Papildus translācijas pieejamas Eurosport kanālos.
                            </p>
                          </div>
                          
                          <div className="p-4 bg-slate-50 rounded-lg border border-slate-100">
                             <h3 className="font-bold text-slate-900 mb-2 flex items-center">
                               <ExternalLink className="w-4 h-4 mr-2" />
                               Saites
                            </h3>
                             <ul className="space-y-2 text-sm">
                                <li>
                                   <a href="https://www.lsm.lv/sports/" target="_blank" className="text-[#9E3039] font-medium hover:underline flex items-center">
                                      LSM Sports (Ziņas & Video)
                                   </a>
                                </li>
                                <li>
                                   <a href="https://olimpiade.lv/" target="_blank" className="text-[#9E3039] font-medium hover:underline flex items-center">
                                      Latvijas Olimpiskā Komiteja
                                   </a>
                                </li>
                                <li>
                                   <a href="https://milanocortina2026.olympics.com/" target="_blank" className="text-[#9E3039] font-medium hover:underline flex items-center">
                                      Oficiālā Milano Cortina 2026 lapa
                                   </a>
                                </li>
                             </ul>
                          </div>
                       </div>
                     </div>
                  </div>
                )}

              </main>

              {/* Detalizētā skata logs */}
              {selectedEvent && (
                <SacensibuCentrs event={selectedEvent} onClose={() => setSelectedEvent(null)} />
              )}

            </div>
          );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<LatviaOlympicsApp />);
    </script>
</body>
</html>
